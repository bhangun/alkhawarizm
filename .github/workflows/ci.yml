name: Alkhawarizm CI

on:
  pull_request:
    paths:
      - "core/**"
      - "backend/**"
      - "models/**"
      - "buildSrc/**"
      - "gradle/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "core/**"
      - "backend/**"
      - "models/**"
      - "buildSrc/**"
      - "gradle/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Java 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and Test (CPU)
        shell: bash
        env:
          GRADLE_OPTS: -Xmx3G
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace test -x :backend:metal:alkhawarizm-backend-metal:test

  publish-snapshot:
    name: Publish Snapshot to Maven Local
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Publish to Maven Local
        shell: bash
        env:
          GRADLE_OPTS: -Xmx3G
        run: |
          set -euo pipefail
          ./gradlew --no-daemon publishToMavenLocal -x test
